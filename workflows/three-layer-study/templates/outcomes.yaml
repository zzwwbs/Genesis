schema_version: '1.0'
study_id: '{{study_id}}'
outcomes: []
# Datasets are the study's analysis tables: flat rows extracted from the recorded
# run, exported with the run as CSV and Parquet. Declare one per unit a researcher
# will analyse (an article, a detection, a response). Every row carries the run,
# condition, factor levels, replication and round, so rows from all cells stack.
#
# datasets:
# - id: detections
#   source: {kind: artifacts, artifact_type: detection-result}
#       # kind: artifacts -> artifact_type (and optionally process)
#       # kind: events    -> path, a dotted path to a list on each event
#       #                    (e.g. state_delta.analytics)
#       # kind: state     -> state, and snapshot: final | each_completed_round
#   explode: items      # optional: one row per element of a list (or entry of a
#                       # mapping) at this path -- a feed's items, a map keyed by id
#   fields:
#   - {name: flagged, op: comparison, field: score, operator: gte, value: 7}
#       # op: copy | literal | arithmetic | comparison | conditional
#   where:
#   - {field: score, op: gte, value: 0}
#   deduplicate_on: [artifact_id]
#   missing: retain_null
#
# outcomes:                    # simple summaries only; anything more (a rate
# - id: flagged-by-round       # difference, a difference-in-differences, a
#   source: detections         # concentration index) is computed by the
#   grouping: [phase]          # researcher from the exported datasets
#   aggregation: {op: mean, field: flagged}
#       # op: count | sum | mean | distribution | trajectory; field is required
#       # except for count. A mean of a true/false field is a proportion.
#   missingness: {policy: exclude}   # exclude | zero
#   window: {time_field: phase, start: 1, end: 20}
#       # source: a dataset id above, a declared artifact id, or events |
#       # artifacts | state | lineage. Any other key is refused at compile.
#
# traces:                      # narrative evidence chains for qualitative reading
# - id: escalation-trace
#   title: A creator escalating after an unexplained payoff drop
#   seed: {dataset: item-rows, order_by: [phase, commit_order], select: first}
#   depth: 12
