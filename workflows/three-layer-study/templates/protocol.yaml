schema_version: '1.0'
study_id: '{{study_id}}'
time_model:
  type: rounds
  end: 10
# The protocol declares the condition space, not the model. ONE build serves every
# condition: runs are expanded from this declaration at execution time, and each
# run records its own condition_id.
#
# Declare EITHER factors OR conditions -- never both. A package carrying both is
# refused at run time.
#
# factors:                     # crossed design; cells are the product of levels
# - id: governance
#   levels: [none, on]
#   branchable: true           # only branchable factors may be overridden by a
# - id: visibility             # branch replay of an existing run
#   levels: [low, high]
#
# conditions:                  # OR an explicit list, when cells are not crossed
# - id: baseline
#   factors: {governance: none, visibility: low}
#
# A factor id is readable from any predicate as condition.factors.<factor_id>.
#
# phases:                      # named spans, readable as protocol.phase
# - id: pre-intervention
#   start: 1
#   end: 19
# - id: post-intervention
#   start: 20
#   end: 40
#
# NOT declared here -- these are execution settings, chosen when the study is run:
#   how many replications (draws) to take, how many worlds to initialise, and any
#   cap on events that guards against runaway spend. They say how much of the
#   study to realise, not what it is, so keeping them out is what lets the build
#   digest mean one study rather than one sample size -- and lets a finished study
#   be extended with more draws later against the identical build.
#
# There is no checkpoint or retention policy to declare: the runtime has never
# read one, so declaring it promised a durability guarantee that did not exist.
#
# matching:                    # aligns streams so cells are comparable
#   enabled: true
#   shared_streams: [population, activation-order]
#   shared_initialization: true
# random_streams:
# - id: population
#   purpose: [initial population draw]
#   # Seeding is derived from the run's identity, not declared: nothing
#   # reads a seed_policy, so writing one records an intent the engine
#   # does not act on. Sharing a stream across cells is `matching`.
# termination:
# - {type: end_time, at: 40, early_stopping: false}
# model_freezing: true         # pin the models and schemas for the whole study --
#                              # a claim about stability, so it belongs here
