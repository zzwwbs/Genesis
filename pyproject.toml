[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genesis-abm"
version = "0.1.0"
description = "Local-first generative agent-based modeling research system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "pyyaml>=6.0,<7",
  "pyarrow>=17,<24",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "hypothesis>=6,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "duckdb>=1,<2",
]

[project.scripts]
genesis = "genesis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["genesis"]
