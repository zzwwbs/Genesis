name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools/check_traceability.py
      - run: ruff format --check src tests tools/check_traceability.py
      - run: mypy src
      - run: python tools/check_traceability.py
      - run: pytest
