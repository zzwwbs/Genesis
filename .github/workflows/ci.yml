name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools/check_traceability.py tools/smoke_check.py
      - run: ruff format --check src tests tools/check_traceability.py tools/smoke_check.py
      - run: mypy src
      - run: pytest
      # The suite exercises the library in-process. This exercises the command
      # line end to end: create a workspace, then validate, compile, run and
      # evaluate a small declarative study, with no model provider and no network.
      - run: python tools/smoke_check.py
